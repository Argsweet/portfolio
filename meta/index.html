<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="../style.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta</title>
  </head>
  <body>
    <div id="slider">
      <label class="time-filter">
        <input id="commit-progress" type="range" min="0" max="100" value="0" />
        <time id="commit-time"></time>
      </label>
    </div>

    <div id="stats"></div>

    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <h2>Commits by time of day</h2>
        <div id="chart"></div>

        <dl id="commit-tooltip" class="info tooltip" hidden>
          <dt>Commit</dt>
          <dd>
            <a href="" id="commit-link" target="_blank"></a>
          </dd>

          <dt>Date</dt>
          <dd id="commit-date"></dd>

          <!-- Add: Time, author, lines edited -->
        </dl>

        <p id="selection-count">No commits selected</p>

        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <div id="scrolly-2">
      <dl id="files"></dl>
      <div id="files-story"></div>
    </div>

    <script type="module" src="../global.js"></script>
    <script src="main.js" type="module" defer></script>
  </body>
</html>
