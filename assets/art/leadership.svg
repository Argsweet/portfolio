<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420" role="img" aria-label="Placeholder character art">
  <defs>
    <linearGradient id="hair-leadership" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9d7a"/>
      <stop offset="100%" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="body-leadership" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="halo-leadership" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ff9d7a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glow behind the character -->
  <circle cx="150" cy="170" r="145" fill="url(#halo-leadership)"/>

  <!-- shoulders / torso -->
  <path d="M150 250 C 96 250 62 292 54 356 C 50 386 52 404 56 420 L 244 420 C 248 404 250 386 246 356 C 238 292 204 250 150 250 Z"
        fill="url(#body-leadership)"/>

  <!-- neck -->
  <path d="M128 214 h44 v46 c0 12 -44 12 -44 0 Z" fill="#ffd27a" opacity="0.75"/>

  <!-- face -->
  <ellipse cx="150" cy="158" rx="60" ry="68" fill="#0d0b1a"/>
  <ellipse cx="150" cy="158" rx="60" ry="68" fill="#ffd27a" opacity="0.18"/>

  <!-- hair: back mass + fringe -->
  <path d="M150 74 C 96 74 76 116 78 162 C 80 200 74 214 68 236 C 92 226 96 206 96 186 C 112 168 128 160 150 160 C 172 160 188 168 204 186 C 204 206 208 226 232 236 C 226 214 220 200 222 162 C 224 116 204 74 150 74 Z"
        fill="url(#hair-leadership)"/>
  <path d="M150 92 C 116 92 100 118 100 140 C 118 128 132 122 150 122 C 168 122 184 130 198 142 C 200 118 184 92 150 92 Z"
