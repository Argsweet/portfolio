  <!-- eyes + smile, kept minimal so it reads as a placeholder -->
  <path d="M124 162 q10 -12 20 0" stroke="#ff9d7a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M156 162 q10 -12 20 0" stroke="#ff9d7a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M140 190 q10 8 20 0" stroke="#ff9d7a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- rim light down one side -->
